<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Artículo y sujeto</title><link rel="stylesheet" href="../creditos.css"><link rel="stylesheet" href="../pantalla-completa.css"><link rel="stylesheet" href="../idioma-voz.css"><link rel="stylesheet" href="estilo.css?v=teclas-claras"><script>window.IDIOMA_VOZ_APP='articulosSujeto';</script><script src="../idioma-voz-textos.js?v=creditos-msc"></script><script src="textos.js"></script><script src="../idioma-voz.js"></script><script src="../matematicas-base.js"></script><link rel="stylesheet" href="../teclado-en-pantalla.css?v=teclas-claras">
</head><body>
<main id="app" class="app"><aside id="herramientas" aria-label="Herramientas de la actividad"><header class="cabecera" id="cabecera"><div class="marca" aria-hidden="true"><svg viewBox="0 0 72 64"><rect x="3" y="6" width="42" height="42" rx="12" fill="#f9ce80" transform="rotate(-8 24 27)"/><rect x="30" y="23" width="38" height="37" rx="12" fill="#99dac6" transform="rotate(8 49 42)"/><text id="marcaArticulo" x="10" y="35" font-family="Trebuchet MS, sans-serif" font-weight="900" font-size="24" fill="#85552a">El</text><circle cx="49" cy="43" r="8" fill="#307c6d"/></svg></div><h1>Artículo<br>y sujeto</h1><a class="casa" id="casa" href="../index.html" aria-label="Volver a las aplicaciones" title="Volver a las aplicaciones">⌂</a><label class="nombre-nino">Nombre del niño<input id="nombre" maxlength="40" autocomplete="given-name" data-no-traducir></label></header>
<section class="guia" id="guia"><h2>Así jugamos</h2><p id="instruccion"></p><div id="ayudas"><button id="pista" aria-label="Pista" title="Pista">💡 <span>Pista</span></button><button id="escuchar" aria-label="Escuchar" title="Escuchar">🔊 <span>Escuchar</span></button></div></section>
<button id="configurar" aria-label="Configuración" title="Configuración">⚙ <span>Configuración</span></button><button id="nueva" aria-label="Nueva ronda" title="Nueva ronda">↻ <span>Nueva ronda</span></button></aside>
<section class="actividad" aria-label="Práctica de artículos y sujeto"><header class="barra-reto"><span id="progreso"></span><span id="metodoActual"></span><span id="estrellas" aria-label="Estrellas">☆ 0</span></header><section id="ejercicio" class="ejercicio" aria-label="Oración e imagen"><div class="texto-ejercicio"><div id="huecos" class="huecos"></div><p id="resto" class="resto"></p></div><figure id="figura"><div id="imagenes" class="imagenes"></div><figcaption id="pistaImagen"></figcaption></figure></section>
<section id="banco" class="banco" aria-label="Opciones de respuesta"><div class="grupo-banco"><h2>Artículos</h2><div id="articulos" class="fichas" aria-label="Fichas de artículos"></div></div><div class="grupo-banco"><h2>Nombres</h2><div id="nombres" class="fichas" aria-label="Fichas de nombres"></div></div></section><div id="tecladoSujeto" class="teclado-propio" role="group" aria-label="Teclado de letras" hidden></div><p id="estado" class="estado" role="status" aria-live="polite"></p><div class="acciones"><button id="revisar" class="principal">✓ Revisar</button><button id="siguiente">Siguiente pregunta →</button></div></section></main>
<button id="plegar" aria-controls="herramientas" aria-expanded="true" aria-label="Ocultar panel" title="Ocultar panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button><div id="flotantes" hidden></div>
<dialog id="configuracion" aria-labelledby="tituloConfig"><header><h2 id="tituloConfig">Configuración</h2><button id="cerrarConfig" type="button" aria-label="Aplicar y cerrar">✕</button></header><form id="formConfig"><fieldset><legend>Tu práctica</legend><div class="config-grid"><label>Cómo responder<select id="tipoRespuesta"><option value="fichas">Fichas</option><option value="teclado">Teclado</option></select></label><label>Número de los sujetos<select id="numero"><option value="singular">Singular (uno)</option><option value="plural">Plural (varios)</option><option value="mixto">Singular y plural</option></select></label><label>Preguntas por ronda<input id="cantidad" type="number" min="1" max="20" required></label></div><label class="check"><input id="indefinidos" type="checkbox">Aceptar artículos indefinidos (un, una, unos, unas)</label></fieldset><fieldset><legend>Imágenes para practicar</legend><div id="elegirImagenes" class="elegir-imagenes"></div></fieldset><fieldset><legend>Ayudas y lectura</legend><label class="check"><input id="permitirPistas" type="checkbox">Permitir pistas</label><label class="check"><input id="narracion" type="checkbox">Leer instrucciones y felicitaciones</label><label class="check"><input id="celebrar" type="checkbox">Mostrar celebración</label></fieldset><section id="voz"></section><p id="errorConfig" role="alert"></p><button class="principal" type="submit">Aplicar y volver al juego</button></form></dialog>
<canvas id="celebracion" aria-hidden="true"></canvas><footer id="creditos-aplicaciones"><div class="creditos-dedicatoria"><span class="creditos-gabriel">Creado para <strong>Gabriel</strong></span><span class="creditos-familia">Por su familia, con ayuda de la IA.</span></div><div class="creditos-equipo"><span class="creditos-autores">M.Sc. Jeffry Chavarría-Molina y M.Sc. Natalia Rodríguez-Granados</span><span class="creditos-institucion">Instituto Tecnológico de Costa Rica</span></div></footer><script src="datos.js"></script><script src="modelo.js"></script><script src="../teclado-en-pantalla.js?v=teclas"></script><script src="aplicacion.js?v=teclas"></script><script src="../pantalla-completa.js"></script><script src="../nombre-compartido.js"></script></body></html>
