<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comprensión lectora</title>
<style>
:root{
  --azul:#2563eb;--texto:#102a43;--borde:#cfe3ff;--sombra:0 14px 32px rgba(37,99,235,.14);--radio:28px;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color:var(--texto);
  background:radial-gradient(circle at top left,rgba(125,211,252,.75),transparent 28rem),
             radial-gradient(circle at top right,rgba(253,186,116,.60),transparent 26rem),
             linear-gradient(135deg,#e0f7ff,#fff7d6 55%,#ffe4f2);
  overflow-x:hidden;
}
.app{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:18px 0 28px}
header{
  background:rgba(255,255,255,.86);border:3px solid rgba(255,255,255,.95);
  border-radius:var(--radio);padding:clamp(18px,3vw,32px);box-shadow:var(--sombra);
  display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:center;
}
h1{margin:0;color:var(--azul);font-size:clamp(2rem,5vw,4rem);line-height:1}
.subtitulo{margin:10px 0 0;font-weight:800;color:#415a77;font-size:clamp(1rem,2vw,1.25rem);line-height:1.45}
.panel-nombre{background:linear-gradient(160deg,#fff,#eff6ff);border:3px solid #bfdbfe;border-radius:24px;padding:16px;box-shadow:0 8px 22px rgba(37,99,235,.10)}
.nombre-linea{font-size:1.15rem;font-weight:900;color:#1e3a8a;margin-bottom:8px}
.nombre-mostrado{display:inline-block;background:#fff7ed;color:#9a3412;border:2px solid #fed7aa;border-radius:999px;padding:6px 12px;margin-left:4px}
.ayuda{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:900;color:#334155}
.switch{position:relative;width:66px;height:36px}.switch input{display:none}
.slider{position:absolute;inset:0;cursor:pointer;background:#cbd5e1;border-radius:999px;transition:.2s;border:3px solid white;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:#22c55e}.switch input:checked+.slider:before{transform:translateX(30px)}
.panel{margin-top:18px;background:rgba(255,255,255,.88);border:3px solid rgba(255,255,255,.96);border-radius:var(--radio);box-shadow:var(--sombra);padding:clamp(14px,2.5vw,24px)}
.niveles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.boton-nivel{border:0;border-radius:26px;min-height:150px;padding:18px;color:white;font:inherit;text-align:left;cursor:pointer;box-shadow:0 12px 24px rgba(15,23,42,.16);transition:.18s;touch-action:manipulation}
.boton-nivel:hover{transform:translateY(-4px) scale(1.01)}.boton-nivel h2{margin:0 0 8px;font-size:1.55rem}.boton-nivel p{margin:0;font-weight:800;line-height:1.35}
.n1{background:linear-gradient(135deg,#2563eb,#38bdf8)}.n2{background:linear-gradient(135deg,#16a34a,#86efac)}.n3{background:linear-gradient(135deg,#f97316,#fbbf24)}.n4{background:linear-gradient(135deg,#7c3aed,#f472b6)}
.oculto{display:none!important}
.barra-juego{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.pill{background:#eff6ff;border:2px solid #bfdbfe;color:#1e3a8a;border-radius:999px;padding:8px 14px;font-weight:950}
.lectura{background:#fff;border:4px solid var(--borde);border-radius:30px;padding:clamp(16px,3vw,28px);box-shadow:0 10px 20px rgba(37,99,235,.08)}
.parrafo{display:flex;align-items:flex-start;gap:12px;margin:0 0 16px}.parrafo:last-child{margin-bottom:0}
.parrafo-texto{flex:1;font-size:clamp(1.25rem,2.2vw,1.65rem);line-height:1.75;font-weight:850;color:#153e75}
.parlante{flex:0 0 auto;width:46px;height:46px;border:0;border-radius:16px;background:#fff7ed;border:3px solid #fed7aa;color:#9a3412;font-size:1.35rem;cursor:pointer;box-shadow:0 6px 14px rgba(249,115,22,.16)}
.preguntas{margin-top:16px;display:grid;gap:14px}
.pregunta{background:#fff;border:3px solid #dbeafe;border-radius:24px;padding:clamp(14px,2.5vw,22px);box-shadow:0 8px 18px rgba(37,99,235,.08)}
.pregunta-titulo{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.pregunta h3{flex:1;margin:0;color:#102f86;font-size:clamp(1.15rem,2vw,1.45rem);line-height:1.35}
.opciones,.bateria{display:flex;flex-wrap:wrap;gap:10px}
.opcion,.palabra{border:3px solid #bfdbfe;background:#eff6ff;color:#153e75;border-radius:18px;padding:12px 16px;font-size:clamp(1rem,1.8vw,1.15rem);font-weight:900;cursor:pointer;user-select:none;touch-action:manipulation}
.palabra{background:#fff7cc;border-color:#facc15;cursor:grab}
.opcion.seleccionada{background:#dbeafe;border-color:#2563eb}
.zona-respuesta{min-height:64px;border:3px dashed #93c5fd;background:#f8fbff;border-radius:18px;padding:10px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.zona-respuesta.activa{background:#eef6ff}.correcta{background:#dcfce7!important;border-color:#16a34a!important}.incorrecta{background:#fee2e2!important;border-color:#dc2626!important}
.acciones{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.btn{border:0;border-radius:20px;min-height:52px;padding:12px 18px;font-size:1.05rem;font-weight:950;color:white;cursor:pointer;touch-action:manipulation;box-shadow:0 10px 20px rgba(15,23,42,.14)}
.btn-verificar{background:linear-gradient(135deg,#16a34a,#22c55e)}.btn-siguiente{background:linear-gradient(135deg,#2563eb,#38bdf8)}.btn-niveles{background:linear-gradient(135deg,#7c3aed,#a855f7)}
.mensaje-error{background:#fef2f2;border:3px solid #fecaca;color:#991b1b;border-radius:24px;padding:18px;font-weight:900;line-height:1.5}
footer{text-align:center;padding:20px;color:#355166;font-weight:850}
.confeti{position:fixed;top:-20px;pointer-events:none;z-index:9999;animation:caer 5s linear forwards}
@keyframes caer{0%{transform:translateY(-20px) rotate(0deg);opacity:1}70%{opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
@media(max-width:1024px){header{grid-template-columns:1fr}.niveles{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:18px}}
@media(max-width:720px){.app{width:min(100% - 14px,1180px);padding-top:8px}.niveles{grid-template-columns:1fr}.boton-nivel{min-height:118px}.parrafo{gap:8px}.parlante{width:42px;height:42px}}
@media(orientation:landscape) and (max-height:760px){header{grid-template-columns:1.2fr .8fr;padding:16px}h1{font-size:clamp(1.8rem,4vw,3rem)}.boton-nivel{min-height:120px}.parrafo-texto{font-size:clamp(1.1rem,1.8vw,1.35rem);line-height:1.55}}
</style>
</head>
<body>
<main class="app">
<header>
<section>
<h1>📚 Comprensión lectora</h1>
<p class="subtitulo">Lee con calma, responde preguntas concretas y practica paso a paso.</p>
</section>
<aside class="panel-nombre">
<div class="nombre-linea">Niño: <span id="nombreMostrado" class="nombre-mostrado">Gabriel</span></div>
<div class="ayuda"><span>🔊 Ayuda verbal</span><label class="switch" aria-label="Activar o desactivar ayuda verbal"><input type="checkbox" id="ayudaVerbal"><span class="slider"></span></label></div>
</aside>
</header>

<section id="errorBase" class="panel mensaje-error oculto"></section>

<section id="pantallaInicio" class="panel">
<div class="niveles">
<button class="boton-nivel n1" onclick="iniciarNivel(1)"><h2>Nivel 1</h2><p>3 oraciones y 2 preguntas.</p></button>
<button class="boton-nivel n2" onclick="iniciarNivel(2)"><h2>Nivel 2</h2><p>4 oraciones y 3 preguntas.</p></button>
<button class="boton-nivel n3" onclick="iniciarNivel(3)"><h2>Nivel 3</h2><p>2 párrafos y 4 preguntas.</p></button>
<button class="boton-nivel n4" onclick="iniciarNivel(4)"><h2>Nivel 4</h2><p>3 párrafos y 5 preguntas.</p></button>
</div>
</section>

<section id="pantallaJuego" class="panel oculto">
<div class="barra-juego"><div class="pill" id="etiquetaNivel">Nivel</div><div class="pill" id="etiquetaLectura">Lectura</div></div>
<article id="lectura" class="lectura"></article>
<section id="preguntas" class="preguntas"></section>
<div class="acciones">
<button class="btn btn-verificar" onclick="verificar()">Verificar respuestas ✅</button>
<button class="btn btn-siguiente" onclick="siguienteLectura()">Siguiente lectura ➡️</button>
<button class="btn btn-niveles" onclick="volverNiveles()">Volver a niveles 🏠</button>
</div>
</section>

<footer>Aplicación creada para Gabriel por parte de su familia, con ayuda de la IA.</footer>
</main>

<script>
const URL_GOOGLE_SCRIPT="https://script.google.com/macros/s/AKfycbyENiFqFkDqiesWvdNQuBVBAiAhMtyHc2QLXYOA-rB9uCb8P1Tb6LGKMxDKrXFa8Ow3DA/exec";
const CLAVE_NOMBRE="nombreNinoGabrielApps";
const CLAVE_AYUDA="comprensionLectoraAyudaVerbal";
let baseLecturas=[],nivelActual=null,lecturaActual=null,preguntasActuales=[],ultimaLecturaId=null;
const cantidadPreguntas={1:2,2:3,3:4,4:5};
const nombreMostrado=document.getElementById("nombreMostrado");
const ayudaVerbal=document.getElementById("ayudaVerbal");
const pantallaInicio=document.getElementById("pantallaInicio");
const pantallaJuego=document.getElementById("pantallaJuego");
const errorBase=document.getElementById("errorBase");
const lecturaDiv=document.getElementById("lectura");
const preguntasDiv=document.getElementById("preguntas");
const etiquetaNivel=document.getElementById("etiquetaNivel");
const etiquetaLectura=document.getElementById("etiquetaLectura");

function obtenerNombre(){return localStorage.getItem(CLAVE_NOMBRE)||"Gabriel";}
function actualizarNombreDesdeIndex(){const nombre=(obtenerNombre()||"Gabriel").trim()||"Gabriel";nombreMostrado.textContent=nombre;return nombre;}
window.addEventListener("storage",e=>{if(e.key===CLAVE_NOMBRE)actualizarNombreDesdeIndex();});
window.addEventListener("focus",actualizarNombreDesdeIndex);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)actualizarNombreDesdeIndex();});

ayudaVerbal.checked=localStorage.getItem(CLAVE_AYUDA)==="1";
ayudaVerbal.addEventListener("change",()=>{localStorage.setItem(CLAVE_AYUDA,ayudaVerbal.checked?"1":"0");if(nivelActual&&lecturaActual)renderizarLecturaYPreguntas();});
function ayudaActiva(){return ayudaVerbal.checked;}
function hablar(texto){if(!ayudaActiva())return;try{speechSynthesis.cancel();const voz=new SpeechSynthesisUtterance(texto);voz.lang="es-CR";voz.rate=.88;voz.pitch=1.05;speechSynthesis.speak(voz);}catch(e){}}
function archivoActual(){const partes=window.location.pathname.split("/");return partes[partes.length-1]||"Comprension_Lectora.html";}
function reportarVisita(accion){
 const url=URL_GOOGLE_SCRIPT+"?fechaLocal="+encodeURIComponent(new Date().toLocaleString("es-CR"))+"&nombre="+encodeURIComponent(actualizarNombreDesdeIndex())+"&archivo="+encodeURIComponent(archivoActual())+"&accion="+encodeURIComponent(accion||"abrir");
 try{fetch(url,{method:"GET",mode:"no-cors",keepalive:true}).catch(()=>{});}catch(e){}
}
async function cargarBase(){
 try{
  const r=await fetch("Base_de_lecturas.json",{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const data=await r.json();
  if(!Array.isArray(data)||data.length===0)throw new Error("La base no tiene lecturas.");
  baseLecturas=data;errorBase.classList.add("oculto");
 }catch(e){
  errorBase.classList.remove("oculto");
  errorBase.innerHTML="<strong>⚠️ No se pudo cargar la base de lecturas.</strong><br>Revise que el archivo <b>Base_de_lecturas.json</b> esté en la misma carpeta que esta aplicación y que se esté abriendo desde <b>localhost</b> o desde GitHub Pages.";
  pantallaInicio.classList.add("oculto");
 }
}
function mezclar(arr){return[...arr].sort(()=>Math.random()-.5);}
function escogerLectura(nivel){
 const lecturas=baseLecturas.filter(x=>Number(x.level)===Number(nivel));
 if(lecturas.length===0)return null;
 let candidatas=lecturas;
 if(lecturas.length>1&&ultimaLecturaId)candidatas=lecturas.filter(x=>x.id!==ultimaLecturaId);
 const escogida=candidatas[Math.floor(Math.random()*candidatas.length)];
 ultimaLecturaId=escogida.id;return escogida;
}
function iniciarNivel(nivel){nivelActual=nivel;cargarLecturaNueva();pantallaInicio.classList.add("oculto");pantallaJuego.classList.remove("oculto");reportarVisita("nivel_"+nivel);}
function cargarLecturaNueva(){
 actualizarNombreDesdeIndex();lecturaActual=escogerLectura(nivelActual);
 if(!lecturaActual){errorBase.classList.remove("oculto");errorBase.textContent="No hay lecturas disponibles para este nivel.";return;}
 preguntasActuales=mezclar(lecturaActual.questions||[]).slice(0,cantidadPreguntas[nivelActual]||2);
 renderizarLecturaYPreguntas();
}
function renderizarLecturaYPreguntas(){
 etiquetaNivel.textContent="Nivel "+nivelActual;etiquetaLectura.textContent=lecturaActual.title||lecturaActual.id||"Lectura";
 lecturaDiv.innerHTML="";
 (lecturaActual.text||[]).forEach(parrafo=>{
  const cont=document.createElement("div");cont.className="parrafo";
  if(ayudaActiva()){const btn=document.createElement("button");btn.className="parlante";btn.type="button";btn.textContent="🔊";btn.onclick=()=>hablar(parrafo);cont.appendChild(btn);}
  const txt=document.createElement("div");txt.className="parrafo-texto";txt.textContent=parrafo;cont.appendChild(txt);lecturaDiv.appendChild(cont);
 });
 preguntasDiv.innerHTML="";
 preguntasActuales.forEach((p,i)=>{
  const caja=document.createElement("div");caja.className="pregunta";caja.dataset.answer=p.answer;
  const titulo=document.createElement("div");titulo.className="pregunta-titulo";
  if(ayudaActiva()){const btn=document.createElement("button");btn.className="parlante";btn.type="button";btn.textContent="🔊";btn.onclick=()=>hablar(p.question);titulo.appendChild(btn);}
  const h=document.createElement("h3");h.textContent=`${i+1}. ${p.question}`;titulo.appendChild(h);caja.appendChild(titulo);
  if(p.type==="seleccion2"||p.type==="seleccion3"){
   const opciones=document.createElement("div");opciones.className="opciones";
   (p.options||[]).forEach(op=>{const b=document.createElement("button");b.className="opcion";b.type="button";b.textContent=op;b.onclick=()=>{opciones.querySelectorAll(".opcion").forEach(x=>x.classList.remove("seleccionada","correcta","incorrecta"));b.classList.add("seleccionada");caja.dataset.user=op;};opciones.appendChild(b);});
   caja.appendChild(opciones);
  }else{
   const zona=document.createElement("div");zona.className="zona-respuesta";
   zona.ondragover=ev=>{ev.preventDefault();zona.classList.add("activa");};
   zona.ondragleave=()=>zona.classList.remove("activa");
   zona.ondrop=ev=>{ev.preventDefault();zona.classList.remove("activa");const texto=ev.dataTransfer.getData("text/plain");ponerRespuesta(zona,caja,texto);};
   caja.appendChild(zona);
   const bateria=document.createElement("div");bateria.className="bateria";
   (p.options||[]).forEach(op=>{const chip=document.createElement("div");chip.className="palabra";chip.textContent=op;chip.draggable=true;chip.ondragstart=ev=>ev.dataTransfer.setData("text/plain",op);chip.onclick=()=>ponerRespuesta(zona,caja,op);bateria.appendChild(chip);});
   caja.appendChild(bateria);
  }
  preguntasDiv.appendChild(caja);
 });
}
function ponerRespuesta(zona,caja,texto){zona.textContent="";const chip=document.createElement("span");chip.className="palabra";chip.textContent=texto;zona.appendChild(chip);caja.dataset.user=texto;}
function normalizar(t){return(t||"").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function verificar(){
 let buenas=0;const cajas=preguntasDiv.querySelectorAll(".pregunta");
 cajas.forEach(caja=>{
  const respuesta=normalizar(caja.dataset.answer),usuario=normalizar(caja.dataset.user),ok=respuesta===usuario;if(ok)buenas++;
  caja.querySelectorAll(".opcion").forEach(op=>{op.classList.remove("correcta","incorrecta");if(normalizar(op.textContent)===respuesta)op.classList.add("correcta");if(op.classList.contains("seleccionada")&&!ok)op.classList.add("incorrecta");});
  const zona=caja.querySelector(".zona-respuesta");if(zona){zona.classList.remove("correcta","incorrecta");zona.classList.add(ok?"correcta":"incorrecta");}
 });
 lanzarConfeti();const nombre=actualizarNombreDesdeIndex();setTimeout(()=>hablar(`${nombre}, obtuviste ${buenas} de ${cajas.length} respuestas correctas. Muy bien.`),300);reportarVisita(`verificar_${buenas}_de_${cajas.length}`);
}
function siguienteLectura(){cargarLecturaNueva();window.scrollTo({top:0,behavior:"smooth"});reportarVisita("siguiente_lectura");}
function volverNiveles(){pantallaJuego.classList.add("oculto");pantallaInicio.classList.remove("oculto");try{speechSynthesis.cancel();}catch(e){}}
function lanzarConfeti(){
 const formas=["●","■","▲","◆","✦","1","2","3","4","5"];
 for(let i=0;i<90;i++){const c=document.createElement("div");c.className="confeti";c.textContent=formas[Math.floor(Math.random()*formas.length)];c.style.left=Math.random()*100+"vw";c.style.fontSize=(12+Math.random()*12)+"px";c.style.color=`hsl(${Math.random()*360},90%,48%)`;c.style.animationDuration=(3.5+Math.random()*2.5)+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),6000);}
}
actualizarNombreDesdeIndex();cargarBase();reportarVisita("abrir");
</script>
</body>
</html>
