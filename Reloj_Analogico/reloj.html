<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mi reloj mágico</title><link rel="stylesheet" href="../idioma-voz.css"><link rel="stylesheet" href="../creditos.css"><link rel="stylesheet" href="../pantalla-completa.css"><link rel="stylesheet" href="reloj.css"><script>window.IDIOMA_VOZ_APP='relojAnalogico';</script><script src="../idioma-voz-textos.js"></script><script src="textos.js"></script><script src="../idioma-voz.js"></script></head><body>
<main class="app"><aside id="herramientas"><header class="cabecera"><h1>🕰️ Mi reloj mágico</h1><label class="nombre">Nombre del niño<input id="nombre" maxlength="40" autocomplete="given-name"></label><a href="../index.html" class="casa" aria-label="Volver a las aplicaciones" title="Volver a las aplicaciones">⌂</a></header><section class="guia"><h2>Así jugamos</h2><p id="instruccion"></p></section><nav class="modos" aria-label="Modos de juego"><button data-modo="explica">🌟 Aprende</button><button data-modo="explora">🖐️ Explora</button><button data-modo="construye">🎯 Pon las agujas</button><button data-modo="lee">🔎 Lee el reloj</button></nav><button id="configurar">⚙ Configuración</button><button id="nueva">↻ Nueva ronda</button><div class="ayudas"><button id="ayuda">💡 Pista</button><button id="escuchar">🔊 Escuchar</button></div></aside>
<section class="actividad"><h2 id="reto"></h2><div class="zona-reloj"><svg id="reloj" viewBox="0 0 600 600" role="group" aria-label="Reloj analógico"><image href="reloj.svg" width="600" height="600"/><g id="sector" pointer-events="none"></g><g id="horaria" class="aguja" role="slider" tabindex="0" aria-label="Aguja de las horas" aria-valuemin="0" aria-valuemax="719"><path d="M300 318 L300 184" stroke="#ad4539" stroke-width="17" stroke-linecap="round"/><path d="M300 191 L300 296" stroke="#ef8a72" stroke-width="6" stroke-linecap="round"/><path d="M300 161 L288 184 L312 184 Z" fill="#ad4539"/><path d="M300 325 L300 161" stroke="transparent" stroke-width="42"/></g><g id="minutera" class="aguja" role="slider" tabindex="0" aria-label="Aguja de los minutos" aria-valuemin="0" aria-valuemax="719"><path d="M300 322 L300 104" stroke="#275ba7" stroke-width="12" stroke-linecap="round"/><path d="M300 111 L300 296" stroke="#80caed" stroke-width="4" stroke-linecap="round"/><path d="M300 77 L289 109 L311 109 Z" fill="#275ba7"/><path d="M300 327 L300 77" stroke="transparent" stroke-width="38"/></g><circle cx="300" cy="296" r="17" fill="#fff" stroke="#4b639c" stroke-width="5" pointer-events="none"/></svg></div>
<div class="leyenda"><span class="horas">● Horas: aguja corta</span><span class="minutos">● Minutos: aguja larga</span></div><output id="digital" aria-label="Hora seleccionada"></output><div id="explicacion" class="explicacion"></div><div id="exploracion" class="ajustes-agujas"><button data-cambio="-60">−1 h</button><button data-cambio="60">+1 h</button><button data-cambio="-1">−1 min</button><button data-cambio="1">+1 min</button></div><div id="respuesta"><label>Hora<input id="respuestaHora" type="number" min="1" max="12" inputmode="numeric"></label><span>:</span><label>Minutos<input id="respuestaMinuto" type="number" min="0" max="59" inputmode="numeric"></label></div><div id="lecciones"><button id="anteriorLeccion">←</button><button id="animar">▶ Animación</button><button id="siguienteLeccion">→</button></div><div id="estado" role="status" aria-live="polite"></div><button id="revisar" class="principal">✓ Revisar</button></section></main>
<button id="plegar" aria-controls="herramientas" aria-expanded="true" aria-label="Ocultar panel lateral"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button><div id="ayudasFlotantes" hidden></div>
<dialog id="configuracion"><header><h2>Configuración</h2><button id="cerrarConfig" aria-label="Aplicar y cerrar">✕</button></header><form method="dialog"><label class="campo">Qué horas practicamos<select id="precision"><option value="horas">Solo horas enteras</option><option value="medias">Solo medias horas</option><option value="cuartos">Solo cuartos de hora</option><option value="cinco">Cada 5 minutos</option><option value="libre">Cualquier minuto</option></select></label><label class="casilla"><input id="pistas" type="checkbox"> Permitir pistas</label><label class="casilla"><input id="narracion" type="checkbox"> Leer instrucciones y respuestas</label><section id="preferenciasVoz"></section><button class="principal">Aplicar y volver al juego</button></form></dialog>
<div id="celebracion" aria-hidden="true"></div>
<footer id="creditos-aplicaciones"><div class="creditos-dedicatoria"><span class="creditos-gabriel">Creado para <strong>Gabriel</strong></span><span class="creditos-familia">Por su familia, con ayuda de la IA.</span></div><div class="creditos-equipo"><span class="creditos-autores">M.Sc. Jeffry Chavarría-Molina y Ph.D. (c) Natalia Rodríguez-Granados</span><span class="creditos-institucion">Instituto Tecnológico de Costa Rica</span></div></footer><script src="reloj.js"></script><script src="../pantalla-completa.js"></script></body></html>
