<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Multiplica y agrupa</title><link rel="stylesheet" href="../idioma-voz.css"><link rel="stylesheet" href="../creditos.css"><link rel="stylesheet" href="../pantalla-completa.css"><link rel="stylesheet" href="multiplicacion.css"><script>window.IDIOMA_VOZ_APP='multiplicacion';</script><script src="../idioma-voz-textos.js"></script><script src="textos.js"></script><script src="../idioma-voz.js"></script></head><body>
<main class="app"><aside id="herramientas"><header class="cabecera"><h1>🔷 Multiplica y agrupa</h1><label class="nombre">Nombre del niño<input id="nombre" maxlength="40" autocomplete="given-name"></label><a class="casa" href="../index.html" aria-label="Volver a las aplicaciones" title="Volver a las aplicaciones">⌂</a></header><section class="guia"><h2>Así jugamos</h2><p id="instruccion"></p></section><nav class="modos" aria-label="Modos de juego"><button data-modo="filas">▦ Filas y columnas</button><button data-modo="grupos">◌ Forma grupos</button></nav><button id="configurar">⚙ Configuración</button><button id="nueva">↻ Nueva ronda</button><div id="ayudas"><button id="pista">💡 Pista</button><button id="escuchar">🔊 Escuchar</button><button id="contarArreglo" aria-controls="arreglo" aria-pressed="false">▶ Contar filas y columnas</button></div></aside>
<section class="actividad"><header class="reto"><h2 id="pregunta"></h2></header><div id="espacio" class="espacio"><div id="arreglo" class="arreglo"></div><section id="agrupacion" hidden><div class="barra-magnetica"><p id="guiaGrupos">Acerca una figura a otra para unirlas.</p><div class="acciones-magneticas"><button id="separarFigura" type="button">⤢ Separar figura</button><button id="deshacerGrupo" type="button">↶ Deshacer</button></div></div><div id="planoGrupos" class="plano-magnetico" aria-label="Plano para formar grupos"><svg class="enlaces-grupos" aria-hidden="true"></svg><div class="nodos-grupos"></div></div></section></div>
<section class="resolucion" aria-label="Construye la multiplicación"><p id="pasoRespuesta"></p><div id="ecuacion" class="ecuacion"><div class="respuesta"><span id="etiquetaA"></span><button id="factorA" class="casilla" data-campo="a" type="button" value=""></button></div><span class="signo">×</span><div class="respuesta"><span id="etiquetaB"></span><button id="factorB" class="casilla" data-campo="b" type="button" value=""></button><output id="tamanoDado" hidden></output></div><span class="signo">=</span><div class="respuesta"><span>Total</span><button id="total" class="casilla" data-campo="total" type="button" value=""></button></div></div><div class="entrada-respuesta"><div id="cifras" class="cifras" aria-label="Cifras para responder"></div><button id="borrarNumero" class="borrar-numero" type="button">⌫ Borrar número</button></div></section><p id="estado" role="status" aria-live="polite"></p><button id="revisar" class="principal">✓ Revisar</button></section></main>
<button id="plegar" aria-controls="herramientas" aria-expanded="true" aria-label="Ocultar panel"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button><div id="flotantes" hidden></div>
<dialog id="configuracion"><header><h2>Configuración</h2><button id="cerrarConfig" type="button" aria-label="Aplicar y cerrar">✕</button></header><form method="dialog"><fieldset><legend>Filas y columnas</legend><div class="rangos"><label>Filas: mínimo<input id="filasMin" type="number" min="1" max="6" required></label><label>Filas: máximo<input id="filasMax" type="number" min="1" max="6" required></label><label>Columnas: mínimo<input id="columnasMin" type="number" min="1" max="8" required></label><label>Columnas: máximo<input id="columnasMax" type="number" min="1" max="8" required></label></div><label class="casilla-config"><input id="ayudaConteo" type="checkbox"> Ayuda 2: conteo animado de filas y columnas</label><label class="casilla-config"><input id="sonidoConteo" type="checkbox"> Campanitas durante el conteo</label></fieldset><fieldset><legend>Forma grupos</legend><div class="rangos"><label>Figuras por grupo: mínimo<input id="porGrupoMin" type="number" min="1" max="8" required></label><label>Figuras por grupo: máximo<input id="porGrupoMax" type="number" min="1" max="8" required></label><label>Cantidad de grupos: mínimo<input id="gruposMin" type="number" min="1" max="6" required></label><label>Cantidad de grupos: máximo<input id="gruposMax" type="number" min="1" max="6" required></label></div><label class="campo">Cómo se forman los grupos<select id="disposicionGrupos"><option value="compactos">Compactos (en puños)</option><option value="hileras">En hileras</option><option value="libre">Libre</option></select></label><label class="casilla-config"><input id="inerciaGrupos" type="checkbox"> Deslizar suavemente al soltar</label><label class="casilla-config"><input id="ayudaGrupos" type="checkbox"> Marcar y cerrar los grupos completos</label></fieldset><label class="campo">Figuras<select id="forma"><option value="azar">Cambiar en cada ronda</option><option value="circulo">Círculos</option><option value="cuadrado">Cuadrados</option><option value="triangulo">Triángulos</option><option value="pentagono">Pentágonos</option><option value="estrella">Estrellas</option><option value="rombo">Rombos</option><option value="hexagono">Hexágonos</option><option value="rectangulo">Rectángulos</option></select></label><label class="casilla-config"><input id="permitirPistas" type="checkbox"> Permitir pista breve (Ayuda 1)</label><label class="casilla-config"><input id="narracion" type="checkbox"> Leer instrucciones y respuestas</label><section id="voz"></section><button class="principal" id="aplicar">Aplicar y volver al juego</button></form></dialog>
<div id="celebracion" aria-hidden="true"></div><footer id="creditos-aplicaciones"><div class="creditos-dedicatoria"><span class="creditos-gabriel">Creado para <strong>Gabriel</strong></span><span class="creditos-familia">Por su familia, con ayuda de la IA.</span></div><div class="creditos-equipo"><span class="creditos-autores">M.Sc. Jeffry Chavarría-Molina y Ph.D. (c) Natalia Rodríguez-Granados</span><span class="creditos-institucion">Instituto Tecnológico de Costa Rica</span></div></footer><script src="grupos-magneticos.js"></script><script src="conteo-arreglo.js"></script><script src="multiplicacion.js"></script><script src="../pantalla-completa.js"></script><script src="../nombre-compartido.js"></script>
</body></html>
