<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Multiplica y agrupa</title><link rel="stylesheet" href="../idioma-voz.css"><link rel="stylesheet" href="../creditos.css"><link rel="stylesheet" href="../pantalla-completa.css"><link rel="stylesheet" href="multiplicacion.css?v=barrido-pareo-2"><script>window.IDIOMA_VOZ_APP='multiplicacion';</script><script src="../idioma-voz-textos.js"></script><script src="textos.js"></script><script src="../idioma-voz.js"></script><link rel="stylesheet" href="../iconos/cabeceras.css"><script src="../historial-modos.js"></script></head><body>
<section id="inicioMultiplicacion" class="inicio-multiplicacion"><div id="cabeceraInicio"></div><section class="elegir-modo"><h2>Escoge cómo quieres practicar</h2><div class="tarjetas-modos">
<button data-modo="filas"><span class="icono-modo" aria-hidden="true">▦</span><strong>1. Aprende las tablas</strong><span>Cuenta figuras ordenadas y descubre la multiplicación.</span></button>
<button data-modo="grupos"><span class="icono-modo" aria-hidden="true">◌</span><strong>2. Forma grupos</strong><span>Une figuras en grupos iguales y calcula el total.</span></button>
<button data-modo="pareo"><span class="icono-modo" aria-hidden="true">🚀</span><strong>3. Pareo</strong><span>Une cada multiplicación con su resultado.</span></button>
<button data-modo="completar"><span class="icono-modo" aria-hidden="true">🧩</span><strong>4. Completar</strong><span>Arrastra fichas para completar productos o factores.</span></button>
<button data-modo="seleccion"><span class="icono-modo" aria-hidden="true">☑</span><strong>5. Escoger</strong><span>Lee la pregunta y marca una respuesta.</span></button>
</div></section></section><main id="juegoMultiplicacion" class="app" hidden><aside id="herramientas"><header id="cabeceraApp" class="cabecera"><div class="marca-multiplicacion"><span id="emblemaMultiplicacion" aria-hidden="true"><img class="icono-actividad-en-soporte" src="../iconos/multiplicar-agrupar.webp" width="64" height="64" alt=""></span><h1>Multiplica y agrupa</h1></div><label class="nombre">Nombre del niño<input id="nombre" maxlength="40" autocomplete="given-name"></label><a class="casa" href="../index.html" aria-label="Volver a las aplicaciones" title="Volver a las aplicaciones">⌂</a></header><section class="guia"><h2>Así jugamos</h2><p id="instruccion"></p></section><button id="volverModos">‹ Modos de juego</button><button id="configurar">⚙ Configuración</button><button id="nueva">↻ Nueva ronda</button><div id="ayudas"><button id="pista">💡 Pista</button><button id="escuchar">🔊 Escuchar</button><button id="contarArreglo" aria-controls="arreglo" aria-pressed="false">▶ Contar filas y columnas</button></div></aside>
<section class="actividad"><header class="reto"><h2 id="pregunta"></h2><button id="configurarModo" type="button" aria-label="Configurar este modo" hidden>⚙ Opciones</button></header><div id="espacio" class="espacio"><div id="arreglo" class="arreglo"></div><section id="agrupacion" hidden><div class="barra-magnetica"><p id="guiaGrupos">Acerca una figura a otra para unirlas.</p><div class="acciones-magneticas"><button id="separarFigura" type="button">⤢ Separar figura</button><button id="deshacerGrupo" type="button">↶ Deshacer</button></div></div><div id="planoGrupos" class="plano-magnetico" aria-label="Plano para formar grupos"><svg class="enlaces-grupos" aria-hidden="true"></svg><div class="nodos-grupos"></div></div></section><section id="modosTablas" hidden></section></div>
<section class="resolucion" aria-label="Construye la multiplicación"><p id="pasoRespuesta"></p><div id="ecuacion" class="ecuacion"><div class="respuesta"><span id="etiquetaA"></span><button id="factorA" class="casilla" data-campo="a" type="button" value=""></button></div><span class="signo">×</span><div class="respuesta"><span id="etiquetaB"></span><button id="factorB" class="casilla" data-campo="b" type="button" value=""></button><output id="tamanoDado" hidden></output></div><span class="signo">=</span><div class="respuesta"><span>Total</span><button id="total" class="casilla" data-campo="total" type="button" value=""></button></div></div><div class="entrada-respuesta"><div id="cifras" class="cifras" aria-label="Cifras para responder"></div><button id="borrarNumero" class="borrar-numero" type="button">⌫ Borrar número</button></div></section><p id="estado" role="status" aria-live="polite"></p><button id="revisar" class="principal">✓ Revisar</button></section></main>
<button id="plegar" aria-controls="herramientas" aria-expanded="true" aria-label="Ocultar panel"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button><div id="flotantes" hidden></div>
<dialog id="configuracion"><section id="voz"></section></dialog>
<div id="celebracion" aria-hidden="true"></div><footer id="creditos-aplicaciones"><div class="creditos-dedicatoria"><span class="creditos-gabriel">Creado para <strong>Gabriel</strong></span><span class="creditos-familia">Por su familia, con ayuda de la IA.</span></div><div class="creditos-equipo"><span class="creditos-autores">M.Sc. Jeffry Chavarría-Molina y Ph.D. (c) Natalia Rodríguez-Granados</span><span class="creditos-institucion">Instituto Tecnológico de Costa Rica</span></div></footer><script src="grupos-magneticos.js?v=barrido-2"></script><script src="conteo-arreglo.js"></script><script src="efectos-tablas.js"></script><script src="modos-tablas.js?v=colores-1"></script><script src="configuracion-modos.js?v=barrido-1"></script><script src="multiplicacion.js?v=historial-1"></script><script src="../pantalla-completa.js"></script><script src="../nombre-compartido.js"></script>
</body></html>
